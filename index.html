<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizu Coin - Web3 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .neon-text { text-shadow: 0 0 10px rgba(167, 139, 250, 0.8); }
        .glow-btn:hover { box-shadow: 0 0 20px rgba(167, 139, 250, 0.6); transform: translateY(-2px); transition: all 0.3s ease; }
        .tab-active { border-bottom: 2px solid #a78bfa; color: #a78bfa; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-6 relative z-10">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold neon-text">Mizu Coin</h1>
            <p class="text-gray-400 text-xs">MZU • SHA-256 Network</p>
        </div>

        <!-- Navigasi Tab -->
        <div class="flex justify-around mb-6 text-sm font-bold text-gray-400">
            <button onclick="switchTab('wallet')" id="tab-wallet" class="tab-active pb-1">Wallet</button>
            <button onclick="switchTab('mining')" id="tab-mining" class="pb-1">Mining</button>
            <button onclick="switchTab('explorer')" id="tab-explorer" class="pb-1">Explorer</button>
            <button onclick="switchTab('feed')" id="tab-feed" class="pb-1">Live Feed</button>
        </div>

        <!-- ================= TAB WALLET ================= -->
        <div id="view-wallet">
            <div id="wallet-login" class="space-y-3">
                <h2 class="text-lg font-semibold text-center">Akses Wallet</h2>
                <input type="text" id="login-user" placeholder="Username" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 text-white">
                <input type="password" id="login-pass" placeholder="Password" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 text-white">
                <button onclick="login()" class="w-full bg-purple-600 p-3 rounded-xl font-bold">Login</button>
                <p class="text-center text-xs mt-2 text-gray-400">Belum punya? <span onclick="generateWallet()" class="text-emerald-400 cursor-pointer">Generate Wallet</span></p>
            </div>

            <div id="wallet-info" class="hidden space-y-4">
                <div class="p-3 bg-white/5 rounded-xl break-all">
                    <p class="text-[10px] text-gray-400">Alamat Dompet:</p>
                    <p id="display-address" class="text-emerald-300 font-mono text-xs">-</p>
                </div>
                <div class="p-3 bg-white/5 rounded-xl break-all">
                    <p class="text-[10px] text-gray-400">API Key:</p>
                    <p id="display-apikey" class="text-yellow-300 font-mono text-xs">-</p>
                </div>
                <div class="p-3 bg-white/5 rounded-xl break-all">
                    <p class="text-[10px] text-gray-400">Token:</p>
                    <p id="display-token" class="text-purple-300 font-mono text-xs">-</p>
                </div>
                <div class="text-center p-4 bg-emerald-500/10 rounded-xl border border-emerald-500/30">
                    <p class="text-xs text-gray-400">Saldo Utama</p>
                    <h2 id="display-balance" class="text-3xl font-bold neon-text">0.00000000</h2>
                </div>
                <button onclick="logout()" class="w-full bg-red-500/20 text-red-400 p-2 rounded-xl text-sm border border-red-500/30">Keluar</button>
            </div>
        </div>

        <!-- ================= TAB MINING ================= -->
        <div id="view-mining" class="hidden">
            <div class="text-center p-4 bg-purple-500/10 rounded-xl border border-purple-500/30 mb-4">
                <p class="text-xs text-gray-400 mb-1">Status Cloud Mining</p>
                <h3 id="mining-status" class="text-xl font-bold text-purple-300">OFFLINE</h3>
                <p class="text-[10px] text-gray-400 mt-1">Rate: 1 MZU / 24 Jam</p>
            </div>
            
            <div class="text-center p-4 mb-4">
                <p class="text-xs text-gray-400">Pending Rewards</p>
                <h2 id="pending-rewards" class="text-2xl font-bold text-emerald-300">0.00000000</h2>
            </div>

            <div class="flex gap-2">
                <button onclick="startMining()" class="flex-1 bg-emerald-600 p-3 rounded-xl font-bold text-sm">Mulai Mining</button>
                <button onclick="stopMining()" class="flex-1 bg-red-600 p-3 rounded-xl font-bold text-sm">Stop</button>
            </div>
            <button onclick="claimMining()" class="w-full mt-3 bg-gradient-to-r from-purple-600 to-indigo-600 p-3 rounded-xl font-bold text-sm">Klaim Koin</button>
        </div>

        <!-- ================= TAB EXPLORER ================= -->
        <div id="view-explorer" class="hidden">
            <h2 class="text-lg font-semibold mb-3">🔍 Cari TX / Alamat</h2>
            <input type="text" id="search-query" placeholder="Masukkan Hash TX atau Alamat Dompet" class="w-full p-3 mb-3 rounded-xl bg-white/5 border border-white/10 text-white text-sm">
            <button onclick="searchBlockchain()" class="w-full bg-cyan-600 p-3 rounded-xl font-bold text-sm">Cari</button>
            <div id="search-result" class="mt-4 text-xs break-all p-3 bg-white/5 rounded-xl hidden"></div>
        </div>

        <!-- ================= TAB LIVE FEED ================= -->
        <div id="view-feed" class="hidden">
            <h2 class="text-lg font-semibold mb-3">📡 Real-time Transaksi</h2>
            <div id="live-feed" class="space-y-2 max-h-80 overflow-y-auto text-xs">
                <p class="text-gray-500 italic">Menunggu transaksi masuk...</p>
            </div>
        </div>

    </div>

    <script>
        // GANTI DENGAN URL BACKEND ANDA (Misal: https://api-mizu.onrender.com)
        const API_URL = 'http://localhost:3000'; 
        let currentApiKey = null;
        let tickerInterval = null;
        let eventSource = null;

        // --- NAVIGASI TAB ---
        function switchTab(tab) {
            ['wallet', 'mining', 'explorer', 'feed'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('tab-active');
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');

            if (tab === 'feed' && !eventSource) {
                startLiveFeed();
            }
        }

        // --- 1. WALLET ---
        async function generateWallet() {
            const username = prompt("Masukkan Username baru:");
            const password = prompt("Masukkan Password:");
            if (!username || !password) return;

            const res = await fetch(`${API_URL}/api/wallet/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.error) return alert(data.error);
            
            alert(`Wallet Berhasil Dibuat!\n\nAlamat: ${data.address}\nAPI Key: ${data.apiKey}\nToken: ${data.token}\n\nSimpan informasi ini!`);
            loginWithCredentials(username, password);
        }

        async function login() {
            const username = document.getElementById('login-user').value;
            const password = document.getElementById('login-pass').value;
            loginWithCredentials(username, password);
        }

        async function loginWithCredentials(username, password) {
            const res = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.error) return alert(data.error);

            currentApiKey = data.apiKey;
            document.getElementById('wallet-login').classList.add('hidden');
            document.getElementById('wallet-info').classList.remove('hidden');
            document.getElementById('display-address').innerText = data.address;
            document.getElementById('display-apikey').innerText = data.apiKey;
            document.getElementById('display-token').innerText = data.token;
            updateBalanceUI(data.balance);
            
            // Pindah ke tab mining setelah login
            switchTab('mining');
            startTicker();
        }

        function logout() {
            currentApiKey = null;
            if (tickerInterval) clearInterval(tickerInterval);
            if (eventSource) eventSource.close();
            location.reload();
        }

        function updateBalanceUI(balance) {
            document.getElementById('display-balance').innerText = balance.toFixed(8);
        }

        // --- 2. CLOUD MINING ---
        async function startMining() {
            const res = await fetch(`${API_URL}/api/mining/start`, {
                method: 'POST',
                headers: { 'x-api-key': currentApiKey }
            });
            const data = await res.json();
            if (data.error) return alert(data.error);
            document.getElementById('mining-status').innerText = "ONLINE";
            document.getElementById('mining-status').classList.add('text-emerald-400');
            startTicker();
        }

        async function stopMining() {
            const res = await fetch(`${API_URL}/api/mining/stop`, {
                method: 'POST',
                headers: { 'x-api-key': currentApiKey }
            });
            document.getElementById('mining-status').innerText = "OFFLINE";
            document.getElementById('mining-status').classList.remove('text-emerald-400');
            if (tickerInterval) clearInterval(tickerInterval);
        }

        async function claimMining() {
            const res = await fetch(`${API_URL}/api/mining/claim`, {
                method: 'POST',
                headers: { 'x-api-key': currentApiKey }
            });
            const data = await res.json();
            if (data.error) return alert(data.error);
            
            alert(`Klaim sukses! +${data.amount} MZU`);
            // Refresh saldo
            const statusRes = await fetch(`${API_URL}/api/mining/status`, { headers: { 'x-api-key': currentApiKey } });
            // Update UI balance dari login ulang atau endpoint terpisah
            location.reload(); 
        }

        function startTicker() {
            if (tickerInterval) clearInterval(tickerInterval);
            tickerInterval = setInterval(async () => {
                if (!currentApiKey) return;
                const res = await fetch(`${API_URL}/api/mining/status`, {
                    headers: { 'x-api-key': currentApiKey }
                });
                const data = await res.json();
                if (data.status) {
                    document.getElementById('pending-rewards').innerText = data.pending.toFixed(8);
                }
            }, 2000);
        }

        // --- 3. TRANSFER (Tambahkan di UI Wallet) ---
        // (Fungsi transfer bisa diletakkan di tab Wallet dengan form input toAddress dan amount)

        // --- 4. EXPLORER ---
        async function searchBlockchain() {
            const query = document.getElementById('search-query').value;
            if (!query) return;
            
            const res = await fetch(`${API_URL}/api/explorer/search?query=${query}`);
            const data = await res.json();
            const container = document.getElementById('search-result');
            container.classList.remove('hidden');

            if (data.error) {
                container.innerHTML = `<p class="text-red-400">${data.error}</p>`;
                return;
            }

            if (data.type === 'transaction') {
                container.innerHTML = `
                    <p class="text-emerald-400 font-bold mb-1">Transaksi Ditemukan</p>
                    <p><span class="text-gray-400">Hash:</span> ${data.data.hash}</p>
                    <p><span class="text-gray-400">Dari:</span> ${data.data.from || 'Mining'}</p>
                    <p><span class="text-gray-400">Ke:</span> ${data.data.to}</p>
                    <p><span class="text-gray-400">Jumlah:</span> ${data.data.amount} MZU</p>
                    <p><span class="text-gray-400">Waktu:</span> ${new Date(data.data.timestamp).toLocaleString()}</p>
                `;
            } else if (data.type === 'wallet') {
                container.innerHTML = `
                    <p class="text-purple-400 font-bold mb-1">Wallet Ditemukan</p>
                    <p><span class="text-gray-400">Alamat:</span> ${data.data.address}</p>
                    <p><span class="text-gray-400">Username:</span> ${data.data.username}</p>
                    <p><span class="text-gray-400">Saldo:</span> ${data.data.balance} MZU</p>
                    <p><span class="text-gray-400">Total TX:</span> ${data.data.totalTx}</p>
                `;
            }
        }

        // --- 5. LIVE FEED (Real-time) ---
        function startLiveFeed() {
            eventSource = new EventSource(`${API_URL}/api/explorer/feed`);
            const feedContainer = document.getElementById('live-feed');
            let isFirst = true;

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (isFirst) {
                    feedContainer.innerHTML = '';
                    isFirst = false;
                }

                if (data.event === 'new_tx') {
                    const tx = data.data;
                    const div = document.createElement('div');
                    div.className = 'p-2 bg-white/5 rounded-lg border border-white/10';
                    div.innerHTML = `
                        <p class="font-bold ${tx.type === 'MINING' ? 'text-emerald-400' : 'text-purple-400'}">${tx.type}</p>
                        <p class="text-[10px] text-gray-400">${tx.from ? 'Dari: ' + tx.from.substring(0,10) + '...' : ''} Ke: ${tx.to.substring(0,10)}...</p>
                        <p class="text-[10px] text-yellow-300">${tx.amount} MZU</p>
                    `;
                    feedContainer.prepend(div);
                }
            };
        }
    </script>
</body>
</html>
